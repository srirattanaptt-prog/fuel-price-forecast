name: Auto Fetch EPPO Margins (Every 15 mins)

on:
  schedule:
    # รันทุก 15 นาที ช่วง 08:00 - 10:00 น. (เวลาไทย) เฉพาะวันจันทร์ - ศุกร์ (1-5)
    - cron: '0,15,30,45 1,2 * * 1-5'
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # เปิดให้กดรันด้วยตนเองได้เมื่อต้องการ

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install pandas openpyxl requests beautifulsoup4 holidays

      - name: Run Fetch Script
        run: python fetch_eppo.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPPO margin & FX [$(date '+%Y-%m-%d %H:%M')]" && git push)
