<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แนวโน้มราคาน้ำมัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDF6E3;
      --card-bg: #FCFBF7;
      --border: #E8DFCE;
      --text-main: #3C4242;
      --text-muted: #7E8585;
      --up-color: #2E7D32;
      --down-color: #C62828;
      --accent: #EEE8D5;
      --dot-green: #38A169;
      --dot-red: #E53E3E;
      --proxy-btn: #4A5568;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .sync-status-group {
      display: flex;
      gap: 8px;
    }

    .status-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .status-btn:hover {
      border-color: #CBD5E0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--dot-green);
      transition: background-color 0.2s ease;
    }

    .dot.offline {
      background-color: var(--dot-red);
    }

    .toggle-advance {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-advance:hover {
      background: var(--accent);
      color: var(--text-main);
    }

    .toggle-advance.active {
      background: var(--accent);
      border-color: #D6CDB8;
      color: var(--text-main);
      font-weight: 600;
    }

    .platform-header {
      text-align: center;
      margin: 4px 0 8px 0;
    }

    .platform-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .platform-datetime {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .input-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .input-box label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-box input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      width: 100%;
    }

    /* ปุ่มดึงค่า Proxy (ทดแทน MOPS) */
    .btn-proxy {
      background: var(--proxy-btn);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .btn-proxy:hover {
      opacity: 1;
    }
    .btn-proxy:disabled {
      background: #CBD5E0;
      cursor: wait;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 480px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .fuel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      box-shadow: 0 4px 12px rgba(60, 66, 66, 0.03);
      transition: transform 0.2s ease;
    }

    .fuel-card:hover {
      transform: translateY(-2px);
    }

    .logo-container {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fuel-logo {
      max-height: 44px;
      max-width: 140px;
      object-fit: contain;
    }

    .result-value {
      font-size: 46px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .result-value.up { color: var(--up-color); }
    .result-value.down { color: var(--down-color); }

    .arrow {
      font-size: 38px;
    }

    .advance-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-muted);
      animation: fadeIn 0.25s ease;
    }

    .advance-panel.show {
      display: block;
    }

    .advance-title {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .advance-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
      background: #F8F3E6;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .mini-input-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-input-box label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .mini-input-box input {
      border: 1px solid #D6CDB8;
      background: #FFFFFF;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }

    .step-item {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .step-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .proxy-info {
      font-size: 10px;
      color: #7E8585;
      margin-top: 4px;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="sync-status-group">
        <button class="status-btn" id="btnSyncEppo" title="คลิกเพื่อโหลดข้อมูล EPPO ใหม่อีกครั้ง">
          <span class="dot offline" id="dotEppo"></span>
          <span>EPPO</span>
        </button>
        <button class="status-btn" id="btnSyncFx" title="คลิกเพื่อโหลด หรือ กำหนดค่าอัตราแลกเปลี่ยนเอง">
          <span class="dot offline" id="dotFx"></span>
          <span>Exchange</span>
        </button>
      </div>

      <button class="toggle-advance" id="btnToggleAdvance">
        <span>Advance</span>
      </button>
    </div>

    <div class="platform-header">
      <h1 class="platform-title">แนวโน้มราคาน้ำมัน</h1>
      <div class="platform-datetime" id="liveDateTime">กำลังโหลดวันที่และเวลา...</div>
    </div>

    <!-- Inputs Row (เพิ่มปุ่มดึง Proxy) -->
    <div class="input-grid">
      <div class="input-box">
        <label for="mopsDiesel">
          <span>ΔMOPS ดีเซล (SGD/BBL)</span>
          <button class="btn-proxy" id="btnProxyDiesel" title="ดึงค่า Heating Oil (เวลา 15:30) มาแทนที่">ดึงค่าแทน</button>
        </label>
        <input type="number" id="mopsDiesel" step="0.01" value="0.00" />
        <div class="proxy-info" id="infoProxyDiesel"></div>
      </div>
      <div class="input-box">
        <label for="mopsG95">
          <span>ΔMOPS เบนซิน G95 (SGD/BBL)</span>
          <button class="btn-proxy" id="btnProxyG95" title="ดึงค่า RBOB Gasoline (เวลา 15:30) มาแทนที่">ดึงค่าแทน</button>
        </label>
        <input type="number" id="mopsG95" step="0.01" value="0.00" />
        <div class="proxy-info" id="infoProxyG95"></div>
      </div>
    </div>

    <div class="cards-grid">
      <div class="fuel-card">
        <div class="logo-container">
          <img class="fuel-logo" src="Diesel.png" alt="ดีเซล Diesel" />
        </div>
        <div class="result-value" id="resDiesel">0.00</div>
      </div>

      <div class="fuel-card">
        <div class="logo-container">
          <img class="fuel-logo" src="G95.png" alt="แก๊สโซฮอล์ 95 Gasohol 95" />
        </div>
        <div class="result-value" id="resG95">0.00</div>
      </div>
    </div>

    <div class="advance-panel" id="advancePanel">
      <div class="advance-title">ตั้งค่าตัวแปรค่าการตลาด (Dynamic Margin Inputs)</div>
      
      <div class="advance-controls-grid">
        <div class="mini-input-box">
          <label>มาร์จิ้นดีเซลเมื่อวาน (บาท/ลิตร)</label>
          <input type="number" id="inputMarginDiesel" step="0.0001" value="2.0000" />
        </div>
        <div class="mini-input-box">
          <label>เกณฑ์เป้าหมาย ดีเซล (บาท/ลิตร)</label>
          <input type="number" id="inputTargetDiesel" step="0.0001" value="1.9100" />
        </div>
        <div class="mini-input-box">
          <label>มาร์จิ้น G95 เมื่อวาน (บาท/ลิตร)</label>
          <input type="number" id="inputMarginG95" step="0.0001" value="3.3500" />
        </div>
        <div class="mini-input-box">
          <label>เกณฑ์เป้าหมาย G95 (บาท/ลิตร)</label>
          <input type="number" id="inputTargetG95" step="0.0001" value="3.2500" />
        </div>
      </div>

      <div class="advance-title">วิธีทำและการแทนค่าสูตรละเอียด</div>
      <div class="step-item" id="advDieselCalc"></div>
      <div class="step-item" id="advG95Calc"></div>
      <div style="font-size: 11px; margin-top: 8px;">
        * อัตราแลกเปลี่ยน SGD/THB = <span id="advFxVal">26.1346</span> (ΔFX เทียบปิดเมื่อวาน: <span id="advDfxVal">+0.0000</span>) | ตัวคูณ FX: ดีเซล = 1.10, G95 = 0.80
      </div>
    </div>
  </div>

  <script>
    // Configuration & State
    const STATE = {
      diesel: {
        yesterdayMargin: 2.0000,
        targetMargin: 1.9100,
        factorMops: 0.165,
        factorFx: 1.10
      },
      g95: {
        yesterdayMargin: 3.3500,
        targetMargin: 3.2500,
        factorMops: 0.152,
        factorFx: 0.80
      },
      fxRate: 26.1346,
      prevFxRate: 26.1346,
      dFx: 0.0000,
      usdSgdRate: 1.3200, 
      syncEppo: false,
      syncFx: false,
      showAdvance: false
    };

    const inputMopsDiesel = document.getElementById("mopsDiesel");
    const inputMopsG95 = document.getElementById("mopsG95");
    const resDiesel = document.getElementById("resDiesel");
    const resG95 = document.getElementById("resG95");
    const btnSyncEppo = document.getElementById("btnSyncEppo");
    const btnSyncFx = document.getElementById("btnSyncFx");
    const dotEppo = document.getElementById("dotEppo");
    const dotFx = document.getElementById("dotFx");
    const btnToggleAdvance = document.getElementById("btnToggleAdvance");
    const advancePanel = document.getElementById("advancePanel");
    const advDieselCalc = document.getElementById("advDieselCalc");
    const advG95Calc = document.getElementById("advG95Calc");
    const advFxVal = document.getElementById("advFxVal");
    const liveDateTime = document.getElementById("liveDateTime");

    const inputMarginDiesel = document.getElementById("inputMarginDiesel");
    const inputTargetDiesel = document.getElementById("inputTargetDiesel");
    const inputMarginG95 = document.getElementById("inputMarginG95");
    const inputTargetG95 = document.getElementById("inputTargetG95");

    const btnProxyDiesel = document.getElementById("btnProxyDiesel");
    const btnProxyG95 = document.getElementById("btnProxyG95");
    const infoProxyDiesel = document.getElementById("infoProxyDiesel");
    const infoProxyG95 = document.getElementById("infoProxyG95");

    function updateClock() {
      const now = new Date();
      const thaiMonths = [
        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
        "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
      ];
      const day = now.getDate();
      const month = thaiMonths[now.getMonth()];
      const year = now.getFullYear() + 543;
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      liveDateTime.textContent = `${day} ${month} ${year} เวลา ${hours}:${minutes}:${seconds} น.`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ระบบ Proxy อัจฉริยะ (Smart Intraday Fetching)
    async function fetchProxyMops(fuelType) {
      const btn = fuelType === 'diesel' ? btnProxyDiesel : btnProxyG95;
      const infoDiv = fuelType === 'diesel' ? infoProxyDiesel : infoProxyG95;
      const ticker = fuelType === 'diesel' ? 'HO=F' : 'RB=F'; 
      const input = fuelType === 'diesel' ? inputMopsDiesel : inputMopsG95;
      
      btn.disabled = true;
      btn.innerText = "กำลังดึง...";
      infoDiv.innerText = "กำลังเชื่อมต่อตลาด Futures...";

      try {
        // 1. ดึงอัตราแลกเปลี่ยน USD/SGD สดๆ
        const usdSgdUrl = "https://query1.finance.yahoo.com/v8/finance/chart/SGD=X?interval=1d&range=1d";
        const proxyUsdSgdUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(usdSgdUrl);
        const resUsd = await fetch(proxyUsdSgdUrl);
        if (resUsd.ok) {
            const dataUsd = await resUsd.json();
            const rate = dataUsd?.chart?.result?.[0]?.meta?.regularMarketPrice;
            if (rate > 0) STATE.usdSgdRate = rate;
        }

        // 2. ดึงกราฟแท่ง 1 ชั่วโมง ย้อนหลัง 5 วัน
        const chartUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1h&range=5d`;
        const proxyChartUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(chartUrl);
        
        const resChart = await fetch(proxyChartUrl);
        if (!resChart.ok) throw new Error("ไม่สามารถเชื่อมต่อ API ตลาด Futures ได้");
        
        const data = await resChart.json();
        const timestamps = data?.chart?.result?.[0]?.timestamp;
        const closes = data?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;

        if (!timestamps || !closes || timestamps.length === 0) {
            throw new Error("ไม่มีข้อมูลการซื้อขายในช่วง 5 วันที่ผ่านมา");
        }

        // หากรองเฉพาะแท่งที่เวลา UTC = 08:00 (ตรงกับ 15:00-16:00 ไทย)
        let plattsWindowCloses = [];
        let plattsWindowDates = [];

        for (let i = 0; i < timestamps.length; i++) {
            const date = new Date(timestamps[i] * 1000); 
            if (date.getUTCHours() === 8 && closes[i] !== null) {
                plattsWindowCloses.push(closes[i]);
                plattsWindowDates.push(date);
            }
        }

        if (plattsWindowCloses.length < 1) {
            throw new Error("หาแท่งเทียน 15:30 น. ของเมื่อวานไม่พบ (ตลาดอาจหยุด)");
        }

        const livePrice = closes[closes.length - 1];
        const liveDate = new Date(timestamps[timestamps.length - 1] * 1000);
        const lastPlattsDate = plattsWindowDates[plattsWindowDates.length - 1];
        
        let prevPrice, currPrice, displayTime;

        // เช็คว่ากดหลังจากเวลา 15:30 น. ของวันนี้ไปแล้วหรือยัง?
        const isAfterPlattsToday = (lastPlattsDate.getDate() === liveDate.getDate() && lastPlattsDate.getMonth() === liveDate.getMonth());

        if (isAfterPlattsToday) {
            // กรณีเลยเวลา 15:30 ไปแล้ว -> เอา 15:30 วันนี้ ลบ 15:30 เมื่อวาน
            if (plattsWindowCloses.length < 2) throw new Error("ข้อมูลเมื่อวานไม่พอสำหรับเปรียบเทียบ");
            currPrice = plattsWindowCloses[plattsWindowCloses.length - 1]; 
            prevPrice = plattsWindowCloses[plattsWindowCloses.length - 2]; 
            displayTime = "15:30 น.";
        } else {
            // กรณียังไม่ถึง 15:30 ของวันนี้ (เช่น 14:00 น.) -> เอา Live ปัจจุบัน ลบ 15:30 เมื่อวาน
            currPrice = livePrice;
            prevPrice = plattsWindowCloses[plattsWindowCloses.length - 1]; 
            const h = String(liveDate.getHours()).padStart(2, '0');
            const m = String(liveDate.getMinutes()).padStart(2, '0');
            displayTime = `${h}:${m} น. (Live)`;
        }

        const diffUsdGallon = currPrice - prevPrice;
        const mopsSgdBbl = diffUsdGallon * 42 * STATE.usdSgdRate;

        // อัปเดตช่องกรอกตัวเลขและข้อความอธิบาย
        input.value = mopsSgdBbl.toFixed(2);
        infoDiv.innerText = `ดึงจาก ${ticker} | เทียบ 15:30 เมื่อวาน กับ วันนี้ ${displayTime} | เรท USD/SGD: ${STATE.usdSgdRate.toFixed(3)}`;
        infoDiv.style.color = "#38A169";

        calculate(); 

      } catch (e) {
        infoDiv.innerText = `ผิดพลาด: ${e.message}`;
        infoDiv.style.color = "#E53E3E";
      } finally {
        btn.disabled = false;
        btn.innerText = "ดึงค่าแทน";
      }
    }

    btnProxyDiesel.addEventListener("click", () => fetchProxyMops('diesel'));
    btnProxyG95.addEventListener("click", () => fetchProxyMops('g95'));

    // ดึงค่าอัตราแลกเปลี่ยนหลัก SGD/THB
    async function syncExchangeRate() {
      try {
        const yahooUrl = "https://query1.finance.yahoo.com/v8/finance/chart/SGDTHB=X?interval=1d&range=2d";
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(yahooUrl);
        const res = await fetch(proxyUrl);
        
        if (res.ok) {
          const data = await res.json();
          const quotes = data?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
          const metaPrice = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
          
          if (quotes && quotes.length >= 2) {
            const yesterdayClose = quotes[quotes.length - 2];
            const currentFx = metaPrice || quotes[quotes.length - 1];
            
            if (currentFx > 0 && yesterdayClose > 0) {
              STATE.fxRate = currentFx;
              STATE.prevFxRate = yesterdayClose;
              STATE.dFx = currentFx - yesterdayClose;
              
              STATE.syncFx = true;
              dotFx.classList.remove("offline");
              calculate();
              return;
            }
          }
        }
      } catch (e) {
        console.warn("Yahoo Finance failed, trying fallback...", e);
      }

      try {
        const res = await fetch("https://open.er-api.com/v6/latest/SGD");
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates && data.rates.THB) {
            const currentFx = parseFloat(data.rates.THB);
            let cachedFx = parseFloat(localStorage.getItem("cached_prev_fx"));
            if (isNaN(cachedFx) || cachedFx <= 0) cachedFx = 26.1346;

            STATE.fxRate = currentFx;
            STATE.prevFxRate = cachedFx;
            STATE.dFx = currentFx - cachedFx;

            localStorage.setItem("cached_prev_fx", currentFx.toString());
            STATE.syncFx = true;
            dotFx.classList.remove("offline");
            calculate();
            return;
          }
        }
      } catch (e) {}

      STATE.fxRate = 26.1346;
      STATE.dFx = 0.0000;
      STATE.syncFx = false;
      dotFx.classList.add("offline");
      calculate();
    }

    async function syncEppoData() {
      try {
        const res = await fetch("data.json?t=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          const dMargin = parseFloat(data.dieselMargin) || 0;
          const gMargin = parseFloat(data.g95Margin) || 0;

          if (dMargin > 0 && gMargin > 0) {
            applyMargins(dMargin, gMargin);
            return;
          }
        }
      } catch (e) {}

      const cD = localStorage.getItem("cached_diesel_margin");
      const cG = localStorage.getItem("cached_g95_margin");
      if (cD && cG && parseFloat(cD) > 0 && parseFloat(cG) > 0) {
        applyMargins(parseFloat(cD), parseFloat(cG));
        return;
      }

      STATE.syncEppo = false;
      dotEppo.classList.add("offline");
      calculate();
    }

    function applyMargins(diesel, g95) {
      STATE.diesel.yesterdayMargin = diesel;
      STATE.g95.yesterdayMargin = g95;
      inputMarginDiesel.value = diesel.toFixed(4);
      inputMarginG95.value = g95.toFixed(4);

      localStorage.setItem("cached_diesel_margin", diesel.toString());
      localStorage.setItem("cached_g95_margin", g95.toString());

      STATE.syncEppo = true;
      dotEppo.classList.remove("offline");
      calculate();
    }

    function calculate() {
      STATE.diesel.yesterdayMargin = parseFloat(inputMarginDiesel.value) || 2.0000;
      STATE.diesel.targetMargin = parseFloat(inputTargetDiesel.value) || 1.9100;
      STATE.g95.yesterdayMargin = parseFloat(inputMarginG95.value) || 3.3500;
      STATE.g95.targetMargin = parseFloat(inputTargetG95.value) || 3.2500;

      if (!STATE.fxRate || STATE.fxRate === 0) {
        STATE.fxRate = 26.1346;
      }

      const dMopsDiesel = parseFloat(inputMopsDiesel.value) || 0;
      const dMopsG95 = parseFloat(inputMopsG95.value) || 0;

      const gapDiesel = STATE.diesel.targetMargin - STATE.diesel.yesterdayMargin;
      const costMopsDiesel = dMopsDiesel * STATE.diesel.factorMops;
      const costFxDiesel = STATE.dFx * STATE.diesel.factorFx;
      const totalCostDiesel = costMopsDiesel + costFxDiesel;
      const statusDiesel = gapDiesel - totalCostDiesel;

      const gapG95 = STATE.g95.targetMargin - STATE.g95.yesterdayMargin;
      const costMopsG95 = dMopsG95 * STATE.g95.factorMops;
      const costFxG95 = STATE.dFx * STATE.g95.factorFx;
      const totalCostG95 = costMopsG95 + costFxG95;
      const statusG95 = gapG95 - totalCostG95;

      renderStatus(resDiesel, statusDiesel);
      renderStatus(resG95, statusG95);

      renderAdvance(dMopsDiesel, gapDiesel, costMopsDiesel, costFxDiesel, statusDiesel,
                    dMopsG95, gapG95, costMopsG95, costFxG95, statusG95);
    }

    function renderStatus(el, val) {
      const absVal = Math.abs(val).toFixed(2);
      if (val > 0.005) {
        el.className = "result-value down";
        el.innerHTML = `-${absVal} <span class="arrow">↓</span>`;
      } else if (val < -0.005) {
        el.className = "result-value up";
        el.innerHTML = `+${absVal} <span class="arrow">↑</span>`;
      } else {
        el.className = "result-value";
        el.innerHTML = `0.00`;
      }
    }

    function renderAdvance(dMopsD, gapD, costMopsD, costFxD, statusD, dMopsG, gapG, costMopsG, costFxG, statusG) {
      const labelD = statusD >= 0 ? "เกินเกณฑ์" : "ต่ำเกณฑ์";
      const labelG = statusG >= 0 ? "เกินเกณฑ์" : "ต่ำเกณฑ์";

      advDieselCalc.innerHTML = `
        <strong>ดีเซล B7 (Target ${STATE.diesel.targetMargin.toFixed(2)}):</strong><br/>
        • ส่วนต่างมาร์จิ้น: ${STATE.diesel.targetMargin.toFixed(2)} - ${STATE.diesel.yesterdayMargin.toFixed(4)} = <strong>${gapD >= 0 ? '+' : ''}${gapD.toFixed(4)}</strong><br/>
        • ต้นทุนรวม (MOPS+FX): (${dMopsD.toFixed(2)} × 0.165) + (${STATE.dFx.toFixed(4)} × 1.10) = <strong>${(costMopsD + costFxD) >= 0 ? '+' : ''}${(costMopsD + costFxD).toFixed(4)}</strong><br/>
        • ผลลัพธ์สถานะ: (${gapD.toFixed(4)}) - (${(costMopsD + costFxD).toFixed(4)}) = <strong>${statusD >= 0 ? '+' : ''}${statusD.toFixed(4)}</strong> บาท/ลิตร<br/>
        • รายงาน: <strong>${labelD} ~${Math.abs(statusD).toFixed(2)} บาท</strong>
      `;

      advG95Calc.innerHTML = `
        <strong>แก๊สโซฮอล์ 95 (Target ${STATE.g95.targetMargin.toFixed(2)}):</strong><br/>
        • ส่วนต่างมาร์จิ้น: ${STATE.g95.targetMargin.toFixed(2)} - ${STATE.g95.yesterdayMargin.toFixed(4)} = <strong>${gapG >= 0 ? '+' : ''}${gapG.toFixed(4)}</strong><br/>
        • ต้นทุนรวม (MOPS+FX): (${dMopsG.toFixed(2)} × 0.152) + (${STATE.dFx.toFixed(4)} × 0.80) = <strong>${(costMopsG + costFxG) >= 0 ? '+' : ''}${(costMopsG + costFxG).toFixed(4)}</strong><br/>
        • ผลลัพธ์สถานะ: (${gapG.toFixed(4)}) - (${(costMopsG + costFxG).toFixed(4)}) = <strong>${statusG >= 0 ? '+' : ''}${statusG.toFixed(4)}</strong> บาท/ลิตร<br/>
        • รายงาน: <strong>${labelG} ~${Math.abs(statusG).toFixed(2)} บาท</strong>
      `;

      advFxVal.innerText = STATE.fxRate.toFixed(4);
      const advDfxSpan = document.getElementById("advDfxVal");
      if (advDfxSpan) {
        advDfxSpan.innerText = (STATE.dFx >= 0 ? "+" : "") + STATE.dFx.toFixed(4);
      }
    }

    inputMopsDiesel.addEventListener("input", calculate);
    inputMopsG95.addEventListener("input", calculate);
    inputMarginDiesel.addEventListener("input", calculate);
    inputTargetDiesel.addEventListener("input", calculate);
    inputMarginG95.addEventListener("input", calculate);
    inputTargetG95.addEventListener("input", calculate);

    btnToggleAdvance.addEventListener("click", () => {
      STATE.showAdvance = !STATE.showAdvance;
      btnToggleAdvance.classList.toggle("active", STATE.showAdvance);
      advancePanel.classList.toggle("show", STATE.showAdvance);
    });

    btnSyncEppo.addEventListener("click", async () => {
      await syncEppoData();
      if (!STATE.syncEppo) {
        const userD = prompt("กรุณาระบุ 'มาร์จิ้นดีเซลเมื่อวาน' (บาท/ลิตร):", "2.0000");
        if (userD !== null) {
          const userG = prompt("กรุณาระบุ 'มาร์จิ้น G95 เมื่อวาน' (บาท/ลิตร):", "3.3500");
          if (userG !== null) {
            applyMargins(parseFloat(userD) || 2.0000, parseFloat(userG) || 3.3500);
          }
        }
      }
    });

    btnSyncFx.addEventListener("click", () => {
      const manualDfx = prompt("ป้อนผลต่างค่าเงินบาทย้อนหลัง (เช่น บาทอ่อน 26 สต. ให้พิมพ์ 0.26 หรือ -0.15 สำหรับบาทแข็ง)\n\n*หากต้องการให้ดึงข้อมูลอัตโนมัติ ให้ปล่อยว่างแล้วกด OK");
      if (manualDfx !== null && manualDfx.trim() !== "") {
        STATE.dFx = parseFloat(manualDfx) || 0;
        STATE.syncFx = true;
        dotFx.classList.remove("offline");
        calculate();
      } else {
        syncExchangeRate();
      }
    });

    calculate();
    syncExchangeRate();
    syncEppoData();
  </script>
</body>
</html>
